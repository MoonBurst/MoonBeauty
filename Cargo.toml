[package]
name = "moon-beauty-shell"
version = "0.2.0"
edition = "2021"
authors = ["MoonBeauty"]
description = "High-performance Wayland desktop shell and overlay matrix in Rust & Iced"

[dependencies]
sha2 = "0.10"
rand_chacha = "0.3"
rand = "0.8"
async-channel = "2"
iced = { version = "0.13", features = ["advanced", "tokio", "canvas", "image", "svg"] }
iced_layershell = "0.7"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
walkdir = "2.5"
regex = "1.10"
image = "0.25"
sysinfo = "0.31"
zbus = { version = "4.4", features = ["tokio"] }
wayland-client = "0.31.15"
wayland-protocols = "0.32.13"
wayland-protocols-wlr = "0.3.12"
smithay-client-toolkit = "0.21.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
