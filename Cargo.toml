[package]
name = "moonbeauty"
version = "0.2.0"
edition = "2021"
authors = ["MoonBeauty"]
description = "High-performance Wayland desktop shell and overlay matrix in Rust & Iced"

[dependencies]
mpd_client = "1"
sha2 = "0.10"
iced_futures = "0.14"
iced = { version = "0.14", default-features = false, features = ["advanced", "tokio", "canvas", "image", "svg", "tiny-skia"] }
iced_layershell = { version = "0.14.2", default-features = false, features = ["tiny-skia", "fira-sans"] }
tokio = { version = "1.38", features = ["full"] }
bollard = "0.17"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
walkdir = "2.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
jxl = { version = "0.7", default-features = false }
jxl-image-rs-integration = { version = "0.7", default-features = false }
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-native-tls"] }
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.5", default-features = false, features = ["runtime-tokio"] }
native-tls = "0.2"
mail-parser = "0.9"
html2text = "0.12"
rfd = { version = "0.14", default-features = false, features = ["xdg-portal", "tokio"] }
zbus = { version = "4.4", features = ["tokio"] }

[features]
default = []
# Lockscreen debug bypass (MBS_LOCK_DEBUG_PASS env var). Compile-time
# opt-in only — finding 05. Never ship a release build with this on.
lock-debug-bypass = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true

[patch.crates-io]
layershellev = { path = "vendor/layershellev-0.14.2" }
iced_layershell = { path = "vendor/iced_layershell" }
